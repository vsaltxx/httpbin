name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-22.04
    steps:
      - &checkout-step
        name: Checkout repository
        uses: actions/checkout@v6

      - &python-setup-step
        name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check . --select E9,F63,F7,F82

  test:
    name: Run unit tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - *checkout-step
      - *python-setup-step

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run pytest
        run: python -m pytest test_httpbin.py

  sast:
    name: SAST scan
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - *checkout-step
      - *python-setup-step

      - name: Install bandit
        run: python -m pip install bandit

      - name: Bandit SAST scan
        run: bandit -r httpbin
        