name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-22.04
    steps:
      - &checkout-step
        name: Checkout repository
        uses: actions/checkout@v6

      - &python-setup-step
        name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --select E9,F63,F7,F82

  test:
    name: Run unit tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - *checkout-step
      - *python-setup-step

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest test_httpbin.py

  sast:
    name: SAST scan
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - *checkout-step
      - *python-setup-step

      - name: Install bandit
        run: pip install bandit

      - name: Bandit SAST scan
        run: bandit -r httpbin --severity-level medium

  dependency-audit:
    name: Audit dependencies with pip-audit
    runs-on: ubuntu-22.04
    needs: sast
    steps:
      - *checkout-step

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  secret-scan:
    name: Detect secrets with Gitleaks
    runs-on: ubuntu-22.04
    needs: dependency-audit
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-22.04
    needs: secret-scan
    # if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - *checkout-step

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/httpbin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trivy-scan:
    name: Scan image with Trivy
    runs-on: ubuntu-22.04
    needs: build-and-push
    # if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/httpbin:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
