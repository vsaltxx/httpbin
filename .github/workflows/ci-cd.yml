name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-22.04
    steps:
      - &checkout-step
        name: Checkout repository
        uses: actions/checkout@v6

      - &python-setup-step
        name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --select E9,F63,F7,F82

  test:
    name: Run unit tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - *checkout-step
      - *python-setup-step

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest test_httpbin.py

  sast:
    name: SAST scan
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - *checkout-step
      - *python-setup-step

      - name: Install bandit
        run: pip install bandit

      - name: Bandit SAST scan
        run: bandit -r httpbin --severity-level medium

  dependency-audit:
    name: Audit dependencies with pip-audit
    runs-on: ubuntu-22.04
    needs: sast
    steps:
      - *checkout-step

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
